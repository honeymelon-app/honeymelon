name: Release Build

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  NODE_VERSION: '20'
  RUST_TARGET: aarch64-apple-darwin

jobs:
  pre-release-checks:
    name: Pre-Release Validation
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ env.RUST_TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Refresh FFmpeg sidecars
        run: npm run download-ffmpeg
      - name: Verify FFmpeg binaries
        run: |
          echo "Verifying FFmpeg binaries for pre-release..."
          ls -lh src-tauri/bin/ || { echo "::error::FFmpeg bin directory not found"; exit 1; }
          src-tauri/bin/ffmpeg -version | head -n 1 || { echo "::error::ffmpeg binary not working"; exit 1; }
          src-tauri/bin/ffprobe -version | head -n 1 || { echo "::error::ffprobe binary not working"; exit 1; }
          echo "[OK] FFmpeg binaries verified"
      - name: Lint JavaScript/TypeScript
        run: npm run lint:js
      - name: Lint Markdown docs
        run: npm run lint:md
      - name: Check JS/TS formatting
        run: npm run format:check:js
      - name: Check Markdown formatting
        run: npm run format:check:md
      - name: Type-check TypeScript sources
        run: npm run type-check
      - name: Build frontend bundle
        run: npm run build
      - name: Run unit tests with coverage
        run: npm run test:unit:coverage -- --reporter=default
      - run: cd src-tauri && cargo fmt --all -- --check
      - run: cd src-tauri && cargo clippy --all-targets --all-features -- -D warnings
      - run: cd src-tauri && cargo test --all-features --lib
      - name: Run Rust integration tests
        run: cd src-tauri && cargo test --all-features --tests -- --nocapture
      - name: Run FFmpeg pipeline regression tests (pre-release)
        run: |
          echo "Running FFmpeg pipeline regression tests before release..."
          cd src-tauri && cargo test --test ffmpeg_pipeline -- --nocapture
          echo "[OK] Pipeline regression tests passed"

  build-and-upload:
    name: Build and Upload Artifacts
    runs-on: macos-14
    needs: [pre-release-checks]
    env:
      HAS_DEV_ID: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Import Apple Developer certificate
        if: env.HAS_DEV_ID == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${APPLE_CERTIFICATE:-}" ] || [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ] || [ -z "${KEYCHAIN_PASSWORD:-}" ]; then
            echo "::error::APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / KEYCHAIN_PASSWORD not configured"
            exit 1
          fi

          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          security import certificate.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          echo "[OK] Developer ID certificate imported into CI keychain"
          security find-identity -v -p codesigning build.keychain || true

          # Clean up certificate file for security
          rm -f certificate.p12

      - run: npm ci

      - name: Setup FFmpeg binaries
        run: |
          npm run download-ffmpeg
          ls -lh src-tauri/bin/
          file src-tauri/bin/ffmpeg src-tauri/bin/ffprobe
          src-tauri/bin/ffmpeg -version | head -1 || { echo "::error::ffmpeg not working"; exit 1; }
          src-tauri/bin/ffprobe -version | head -1 || { echo "::error::ffprobe not working"; exit 1; }
          echo "[OK] FFmpeg binaries ready for build"

      - name: Sign FFmpeg binaries (ad-hoc)
        if: env.HAS_DEV_ID == 'false'
        run: |
          echo "Signing FFmpeg binaries with ad-hoc signature..."
          codesign --force -s - src-tauri/bin/ffmpeg
          codesign --force -s - src-tauri/bin/ffprobe

          # Verify signatures applied
          codesign --verify src-tauri/bin/ffmpeg
          codesign --verify src-tauri/bin/ffprobe
          echo "[OK] Ad-hoc signatures applied and verified"

      - name: Sign FFmpeg binaries (Developer ID)
        if: env.HAS_DEV_ID == 'true'
        run: |
          for bin in ffmpeg ffprobe; do
            codesign --sign "${{ secrets.APPLE_SIGNING_IDENTITY }}" \
                     --force --options runtime \
                     --entitlements src-tauri/entitlements.plist \
                     --timestamp --verbose \
                     "src-tauri/bin/$bin"
            codesign --verify --deep --strict --verbose=2 "src-tauri/bin/$bin"
          done

      - name: Build application
        run: |
          set -euo pipefail

          if [ -n "${{ secrets.APPLE_ID }}" ] && [ -n "${{ secrets.APPLE_PASSWORD }}" ] && \
             [ -n "${{ secrets.APPLE_TEAM_ID }}" ] && [ -n "${{ secrets.APPLE_SIGNING_IDENTITY }}" ]; then
            export APPLE_ID="${{ secrets.APPLE_ID }}"
            export APPLE_PASSWORD="${{ secrets.APPLE_PASSWORD }}"
            export APPLE_TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
            export APPLE_SIGNING_IDENTITY="${{ secrets.APPLE_SIGNING_IDENTITY }}"
          else
            export TAURI_SKIP_SIGNING=1 TAURI_SKIP_NOTARIZE=1
          fi

          npm run tauri:build

      - name: Stage release artifacts
        run: |
          BUNDLE_DIR="$(find src-tauri/target -type d -path '*/release/bundle' -print -quit || echo src-tauri/target/release/bundle)"
          STAGING_DIR="$BUNDLE_DIR/release-artifacts"
          mkdir -p "$STAGING_DIR"

          [ -d "$BUNDLE_DIR" ] && {
            [ -d "$BUNDLE_DIR/dmg" ] && cp "$BUNDLE_DIR/dmg"/*.dmg "$STAGING_DIR/" 2>/dev/null || true
            [ -d "$BUNDLE_DIR/macos" ] && (cd "$BUNDLE_DIR/macos" && zip -r ../release-artifacts/Honeymelon-macOS-aarch64.app.zip Honeymelon.app) || true
            ls "$BUNDLE_DIR"/*.zip >/dev/null 2>&1 && cp "$BUNDLE_DIR"/*.zip "$STAGING_DIR/" 2>/dev/null || true
          }

          # Validate artifacts exist
          if [ -z "$(ls -A "$STAGING_DIR" 2>/dev/null)" ]; then
            echo "::error::No artifacts found to stage"
            exit 1
          fi

          ls -lh "$STAGING_DIR"

      - name: Verify bundle signatures
        if: env.HAS_DEV_ID == 'true'
        run: |
          echo "Verifying signatures on built artifacts..."
          BUNDLE_DIR="$(find src-tauri/target -type d -path '*/release/bundle' -print -quit)"

          if [ -d "$BUNDLE_DIR/macos/Honeymelon.app" ]; then
            codesign --verify --deep --strict --verbose=2 "$BUNDLE_DIR/macos/Honeymelon.app"
            echo "[OK] App bundle signature verified"
          fi

          if [ -f "$BUNDLE_DIR/dmg"/*.dmg ]; then
            for dmg in "$BUNDLE_DIR/dmg"/*.dmg; do
              codesign --verify --verbose=2 "$dmg"
              echo "[OK] DMG signature verified: $(basename "$dmg")"
            done
          fi

      - name: Generate checksums
        run: |
          cd src-tauri/target/*/release/bundle/release-artifacts

          echo "Generating checksums..."
          find . -type f -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "[OK] Checksums generated"

      - name: Attach artifacts to GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            src-tauri/target/**/release/bundle/release-artifacts/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
